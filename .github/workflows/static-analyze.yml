name: Static Analyze .NET EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "*.exe"
      - "samples/**"
      - ".github/workflows/static-analyze.yml"

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install analysis tools
        shell: pwsh
        run: |
          dotnet tool install --global ilspycmd
          choco install sysinternals -y

      - name: Find executable
        id: findexe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter *.exe -Recurse |
            Where-Object { $_.FullName -notmatch '\\.git\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "No EXE found in repository" }
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Analyzing $($exe.FullName)"

      - name: Collect metadata and hashes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path analysis | Out-Null
          $exe = "${{ steps.findexe.outputs.exe }}"
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File analysis/hash.txt
          Get-Item $exe | Format-List * | Out-File analysis/file-metadata.txt
          & sigcheck.exe -accepteula -nobanner -a -h -i $exe 2>&1 | Out-File analysis/sigcheck.txt
          $sigExit = $LASTEXITCODE
          "Sigcheck exit code: $sigExit" | Add-Content analysis/sigcheck.txt
          # Sigcheck may return non-zero for signature/trust findings; keep analysis running.
          $global:LASTEXITCODE = 0

      - name: Extract .NET type and method inventory
        shell: pwsh
        run: |
          $exe = "${{ steps.findexe.outputs.exe }}"
          ilspycmd -l c $exe | Out-File analysis/classes.txt
          ilspycmd -l m $exe | Out-File analysis/methods.txt

      - name: Decompile for security review
        shell: pwsh
        run: |
          $exe = "${{ steps.findexe.outputs.exe }}"
          New-Item -ItemType Directory -Force -Path analysis/decompiled | Out-Null
          ilspycmd -p -o analysis/decompiled $exe
          Get-ChildItem analysis/decompiled -Recurse -File |
            Where-Object { $_.Name -match '(keygen|serial|license|patch|crack)' } |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Find security relevant APIs
        shell: pwsh
        run: |
          $patterns = @(
            'Microsoft.Win32','Registry','System.IO','File.','Directory.',
            'Process.Start','System.Net','HttpClient','WebClient','Socket',
            'DllImport','Assembly.Load','AssemblyResolve','ResourceResolve',
            'Cryptography','RSA','AES','MoveFileEx','CreateProcess'
          )
          Get-ChildItem analysis/decompiled -Recurse -File -Include *.cs |
            Select-String -Pattern $patterns -SimpleMatch |
            Out-File analysis/security-relevant.txt

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-static-analysis
          path: analysis/
          retention-days: 7
